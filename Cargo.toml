[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
anchor-common = { git = "https://github.com/stabbleorg/anchor-common.git", rev = "97d13a3872597ada8fe3adf9deca88fd5a200bbc" }
bn = { git = "https://github.com/stabbleorg/amm-sdk.git", rev = "b3ce8a43aa4601b5bfa6c8daeba9e108ab364d2b" }
math = { git = "https://github.com/stabbleorg/amm-sdk.git", rev = "b3ce8a43aa4601b5bfa6c8daeba9e108ab364d2b" }
pyth-solana-receiver-sdk = "0.6.0"
